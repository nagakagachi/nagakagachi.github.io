<div class="post-list">{{ range . }}<article class="post-row"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>{{ with .Params.hatena_original_url }}<span class="migration-label">はてなブログから移行</span>{{ end }}<p>{{ partial "summary.html" . }}</p>{{ with .GetTerms "categories" }}<div class="tags">{{ range . }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</div>{{ end }}</div></article>{{ end }}</div>
