<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" role="img" aria-labelledby="title desc">
<title id="title">異なる枝葉の塊を、共通IBとStorage VBオフセットで同じInstanced Drawへまとめる</title>
<desc id="desc">上向きの細葉A、横へ広がる広葉B、下垂する葉Cは、すべて枝1本4頂点と葉4枚各4頂点の計20頂点10三角形。共通IBを変えず、Storage VBの先頭0、20、40を形状IDで選ぶ。A、B、C、Aの4個の枝葉の塊を1回のIndexed Instanced Drawで配置する。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b4cbd0"/></marker>
<g id="clusterA"><polygon points="2.5,65.0 2.5,-45.0 -2.5,-45.0 -2.5,65.0" fill="#b38a5a"/><polygon points="-49.6,8.0 -19.4,19.4 0.0,45.2 -30.2,33.8" fill="#4a9c7b" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M-49.6 8.0L0.0 45.2" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="62.6,-10.3 35.8,14.3 0.0,21.0 26.8,-3.6" fill="#4a9c7b" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M62.6 -10.3L0.0 21.0" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="-42.4,-46.1 -15.7,-32.1 0.0,-6.5 -26.7,-20.4" fill="#4a9c7b" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M-42.4 -46.1L0.0 -6.5" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="30.4,-79.8 21.9,-52.5 0.0,-34.0 8.5,-61.3" fill="#4a9c7b" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M30.4 -79.8L0.0 -34.0" stroke="#dcebe9" stroke-opacity=".6"/></g>
<g id="clusterB"><polygon points="-64.3,27.4 65.7,-12.6 64.3,-17.4 -65.7,22.6" fill="#b38a5a"/><polygon points="-57.8,-45.1 -25.5,-19.9 -41.6,17.8 -73.9,-7.4" fill="#4d93bc" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M-57.8 -45.1L-41.6 17.8" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="6.6,71.0 -27.1,47.5 -13.0,9.0 20.6,32.5" fill="#4d93bc" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M6.6 71.0L-13.0 9.0" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="26.5,-70.6 49.9,-33.1 19.5,-1.0 -3.8,-38.5" fill="#4d93bc" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M26.5 -70.6L19.5 -1.0" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="97.2,21.4 59.7,26.0 45.5,-9.0 83.0,-13.6" fill="#4d93bc" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M97.2 21.4L45.5 -9.0" stroke="#dcebe9" stroke-opacity=".6"/></g>
<g id="clusterC"><polygon points="-60.5,-37.6 59.5,-12.6 60.5,-17.4 -59.5,-42.4" fill="#b38a5a"/><polygon points="-63.6,35.6 -70.0,-5.5 -42.0,-36.2 -35.5,4.8" fill="#b69458" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M-63.6 35.6L-42.0 -36.2" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="-1.6,74.5 -28.7,24.4 -12.0,-30.0 15.1,20.1" fill="#b69458" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M-1.6 74.5L-12.0 -30.0" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="58.2,56.7 20.2,25.4 18.0,-23.8 56.0,7.6" fill="#b69458" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M58.2 56.7L18.0 -23.8" stroke="#dcebe9" stroke-opacity=".6"/><polygon points="94.0,28.5 59.7,16.8 48.0,-17.5 82.3,-5.8" fill="#b69458" stroke="#dcebe9" stroke-opacity=".5" stroke-width="1"/><path d="M94.0 28.5L48.0 -17.5" stroke="#dcebe9" stroke-opacity=".6"/></g>
</defs>
<rect width="1000" height="1180" rx="14" fill="#142126"/>
<g font-family="sans-serif" font-size="20" fill="#e2eaed">
<text x="28" y="40" font-size="26">枝葉の形・配置が違っても、接続が同じなら同じDraw</text>
<text x="28" y="71" fill="#b3c5cb">各形状は枝1本＋葉4枚 ／ 20頂点・10三角形 ／ 形状全体を1インスタンスとする</text>
<g fill="#1c3037" stroke="#48616b"><rect x="26" y="96" width="300" height="270" rx="8"/><rect x="350" y="96" width="300" height="270" rx="8"/><rect x="674" y="96" width="300" height="270" rx="8"/></g>
<text x="48" y="128" fill="#8dd4b5">A / ID 0：細葉・上向き</text>
<text x="372" y="128" fill="#95c9ed">B / ID 1：広葉・横広がり</text>
<text x="696" y="128" fill="#e1c38a">C / ID 2：長い葉・下垂</text>
<use href="#clusterA" transform="translate(176 238)"/><use href="#clusterB" transform="translate(500 238)"/><use href="#clusterC" transform="translate(824 238)"/>
<text x="48" y="344" fill="#b3c5cb" font-size="18">枝0〜3、葉4〜19の番号は共通</text>
<text x="372" y="344" fill="#b3c5cb" font-size="18">葉の幅・長さ・位置・向きを変更</text>
<text x="696" y="344" fill="#b3c5cb" font-size="18">同じ番号の頂点を別の位置へ配置</text>
<text x="28" y="399" fill="#b3c5cb">枝と葉を含む塊全体で、頂点番号と三角形の接続を揃える</text>
<g fill="#1c3037" stroke="#48616b"><rect x="26" y="418" width="294" height="218" rx="8"/><rect x="346" y="418" width="628" height="218" rx="8"/></g>
<text x="48" y="452" font-size="23">共通IB：1個</text>
<g font-family="monospace" font-size="18"><text x="48" y="487">枝 : [0,1,2,0,2,3]</text><text x="48" y="518">葉0: [4,5,6,4,6,7]</text><text x="48" y="549">葉1〜3: 同じ接続規則</text></g>
<text x="48" y="586" fill="#b3c5cb">合計30 indices / 0〜19を参照</text><text x="48" y="615" fill="#b3c5cb">形状IDでIBは変更しない</text>
<text x="368" y="452" font-size="23">Storage VB：20頂点ずつ連続格納</text>
<rect x="368" y="470" width="582" height="40" rx="4" fill="#142126" stroke="#8dd4b5"/><text x="384" y="497" fill="#8dd4b5" font-size="22">A：先頭 0　→　A0 … A19（枝＋葉4枚）</text>
<rect x="368" y="520" width="582" height="40" rx="4" fill="#142126" stroke="#95c9ed"/><text x="384" y="547" fill="#95c9ed" font-size="22">B：先頭 20　→　B0 … B19（枝＋葉4枚）</text>
<rect x="368" y="570" width="582" height="40" rx="4" fill="#142126" stroke="#e1c38a"/><text x="384" y="597" fill="#e1c38a" font-size="22">C：先頭 40　→　C0 … C19（枝＋葉4枚）</text>
<text x="28" y="683" fill="#b3c5cb">インスタンスごとに形状IDを選択：0（A）、1（B）、2（C）、0（A）</text>
<path d="M173 638V651M173 699V716" fill="none" stroke="#b4cbd0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660 638V651M660 699V716" fill="none" stroke="#b4cbd0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="728" width="948" height="142" rx="8" fill="#20383f" stroke="#8bbab6"/>
<text x="48" y="763" font-size="23">VSで読み取り先を選ぶ（頂点単位）</text>
<text x="48" y="804" font-family="monospace" font-size="25">VB[ 形状ID × 20 + vertex_index ]</text>
<text x="48" y="842" fill="#b3c5cb">例：形状B、葉の頂点番号10 → 1 × 20 + 10 = 30 → B10を読む</text>
<path d="M500 873V917" fill="none" stroke="#b4cbd0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="930" width="948" height="224" rx="8" fill="#1c3037" stroke="#48616b"/>
<text x="48" y="965" font-size="24">1回のIndexed Instanced Drawで、枝葉の塊を4個配置</text>
<text x="48" y="998" fill="#b3c5cb">drawIndexed(30, 4)　／　木への取り付け位置・回転・スケールも個別に適用</text>
<use href="#clusterA" transform="translate(172 1076) rotate(-12) scale(.62)"/>
<use href="#clusterB" transform="translate(390 1076) rotate(12) scale(.62)"/>
<use href="#clusterC" transform="translate(610 1076) rotate(-12) scale(.62)"/>
<use href="#clusterA" transform="translate(830 1076) rotate(30) scale(.56)"/>
<text x="150" y="1138" fill="#8dd4b5">A</text><text x="380" y="1138" fill="#95c9ed">B</text><text x="600" y="1138" fill="#e1c38a">C</text><text x="820" y="1138" fill="#8dd4b5">A</text>
</g></svg>
