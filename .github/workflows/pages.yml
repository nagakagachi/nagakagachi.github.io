name: Build and publish site

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/validate_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'tools/validate_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.167.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output "$archive" "$release/$archive"
          curl --fail --location --retry 3 --output checksums.txt "$release/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        run: hugo --source site --destination "$RUNNER_TEMP/site-public" --cacheDir "$RUNNER_TEMP/hugo-cache" --noBuildLock --gc --minify --panicOnWarning
      - name: Validate output
        run: python3 tools/validate_site.py "$RUNNER_TEMP/site-public"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site-public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
