[package]
name = "rendering-sandbox-v04"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sandbox-v04"
path = "src/main.rs"

[dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "webgpu", "wgsl"] }
winit = { version = "=0.30.12", default-features = false, features = ["rwh_06", "x11"] }
egui = "=0.33.0"
egui-wgpu = { version = "=0.33.0", default-features = false }
egui-winit = { version = "=0.33.0", default-features = false }
bytemuck = { version = "1.24", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "=0.3.82", features = ["Window", "Document", "HtmlCanvasElement", "Element", "HtmlElement", "VisibilityState"] }

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
