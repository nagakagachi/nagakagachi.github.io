<!doctype html>
<meta charset="utf-8">
<title>Terrain compaction GPU regression</title>
<style>body{background:#152127;color:#e1e7e7;font:16px monospace;padding:24px}button{font:inherit;padding:8px}pre{white-space:pre-wrap}</style>
<h1>Terrain compaction GPU regression</h1>
<p>実際のcompact-*.wgslを読み込み、判定結果だけをテストデータに差し替えます。localhostで開き実行してください。</p>
<button id="run">実行</button><pre id="result">未実行</pre>
<script type="module">
const output=document.querySelector('#result'),button=document.querySelector('#run');
button.onclick=async()=>{
  button.disabled=true;output.textContent='GPUテスト中';let device;
  try{
    const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('No adapter');
    const subgroups=adapter.features.has('subgroups');
    device=await adapter.requestDevice({requiredFeatures:subgroups?['subgroups']:[]});
    const root=new URL(new URL(location.href).searchParams.get('source')??'../site/content/lab/webgpu/experiments/terrain-rendering00/',location.href);
    async function load(name){const r=await fetch(new URL(name,root),{cache:'no-cache'});if(!r.ok)throw Error(name+': '+r.status);return r.text();}
    const library=(await load('cull.wgsl')).split('fn tileVisible(')[0]+`
struct Config { count:vec4u }
@group(0) @binding(0) var<uniform> config:Config;
@group(0) @binding(3) var<storage,read> flags:array<u32>;
fn packCandidate(id:u32)->u32 { return id; }
fn tileVisible(id:u32,descriptor:u32)->bool {if(id>=config.count.x){return false;}return flags[id]!=0u;}
`;
    const capacity=1664,sentinel=0xdeadbeef,buffers=[];
    function buffer(size,usage){const b=device.createBuffer({size,usage});buffers.push(b);return b;}
    const config=buffer(16,GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST);
    const flags=buffer(1600*4,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST);
    const visible=buffer(capacity*4,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST);
    const args=buffer(20,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST);
    const staging=buffer(20+capacity*4,GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST);
    const counts=[0,1,15,16,17,31,32,33,63,64,65,127,128,129,1600];let tests=0;const passed=[];
    for(const mode of subgroups?['workgroup','subgroup']:['workgroup']){
      const code=(mode==='subgroup'?'enable subgroups;\n':'')+library+'\n'+await load('compact-'+mode+'.wgsl');
      device.pushErrorScope('validation');
      const module=device.createShaderModule({code});
      const errors=(await module.getCompilationInfo()).messages.filter(m=>m.type==='error');
      if(errors.length)throw Error(errors.map(e=>e.message).join('\n'));
      const pipeline=await device.createComputePipelineAsync({layout:'auto',compute:{module,entryPoint:'cullMain'}});
      const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[
        {binding:0,resource:{buffer:config}},{binding:1,resource:{buffer:visible}},
        {binding:2,resource:{buffer:args}},{binding:3,resource:{buffer:flags}}]});
      for(const n of counts)for(const pattern of ['none','all','alternating','random']){
        const data=Uint32Array.from({length:1600},(_,i)=>i<n && (pattern==='all'||pattern==='alternating'&&i%2===0||pattern==='random'&&((Math.imul(i+17,1664525)+1013904223)>>>0)%7<3)?1:0);
        const expected=[...data.keys()].filter(i=>data[i]);
        device.queue.writeBuffer(config,0,new Uint32Array([n,0,0,0]));device.queue.writeBuffer(flags,0,data);
        device.queue.writeBuffer(visible,0,new Uint32Array(capacity).fill(sentinel));
        device.queue.writeBuffer(args,0,new Uint32Array([26904,0,0,0,0]));
        const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,group);
        // 候補0件でも不可視のworkgroupを1つ実行し、領域予約が不要な経路を検証する。
        pass.dispatchWorkgroups(Math.max(1,Math.ceil(n/64)));pass.end();
        encoder.copyBufferToBuffer(args,0,staging,0,20);encoder.copyBufferToBuffer(visible,0,staging,20,capacity*4);
        device.queue.submit([encoder.finish()]);await staging.mapAsync(GPUMapMode.READ);
        const result=new Uint32Array(staging.getMappedRange()),actual=[...result.slice(5,5+result[1])].sort((a,b)=>a-b);
        const valid=result[0]===26904 && result[1]===expected.length && result[2]===0 && result[3]===0 && result[4]===0 &&
          actual.every((id,i)=>id===expected[i]) && result.slice(5+expected.length).every(x=>x===sentinel);
        staging.unmap();if(!valid)throw Error(`${mode} n=${n} ${pattern}: IDs/count/guard mismatch`);
        tests++;
      }
      const error=await device.popErrorScope();if(error)throw Error(error.message);passed.push(mode+': 60 cases PASS');
    }
    // 対象GPUの独立検証として、実際のPS実行回数を数える。
    // 計測シェーダーにはclip距離もDepthバッファも設けず、
    // NaN位置出力だけで、PSカウンター更新前に三角形が棄却されることを確認する。
    device.pushErrorScope('validation');
    const nanModule=device.createShaderModule({code:`
struct Mode { value:vec4u }
@group(0) @binding(0) var<uniform> mode:Mode;
@group(0) @binding(1) var<storage,read_write> hits:atomic<u32>;
@vertex fn vs(@builtin(vertex_index) id:u32)->@builtin(position) vec4f {
    let points=array<vec2f,3>(vec2f(-0.8,-0.8),vec2f(0.8,-0.8),vec2f(0.0,0.8));
    if(mode.value.x==2u || (mode.value.x==1u && id==0u)) {
        let nan=bitcast<f32>(0x7fc00000u | (mode.value.x & 1u));
        return vec4f(nan);
    }
    return vec4f(points[id],0.5,1.0);
}
@fragment fn ps()->@location(0) vec4f {atomicAdd(&hits,1u);return vec4f(1.0);}
`});
    const nanPipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module:nanModule,entryPoint:'vs'},
        fragment:{module:nanModule,entryPoint:'ps',targets:[{format:'rgba8unorm'}]},primitive:{topology:'triangle-list'}});
    const hits=buffer(4,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST);
    const hitRead=buffer(4,GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST);
    const target=device.createTexture({size:[64,64],format:'rgba8unorm',usage:GPUTextureUsage.RENDER_ATTACHMENT});
    const nanGroup=device.createBindGroup({layout:nanPipeline.getBindGroupLayout(0),entries:[
        {binding:0,resource:{buffer:config}},{binding:1,resource:{buffer:hits}}]});
    const nanCounts=[];
    for(const mode of [0,1,2]){
        device.queue.writeBuffer(config,0,new Uint32Array([mode,0,0,0]));
        const encoder=device.createCommandEncoder();encoder.clearBuffer(hits);
        const pass=encoder.beginRenderPass({colorAttachments:[{view:target.createView(),clearValue:[0,0,0,0],loadOp:'clear',storeOp:'store'}]});
        pass.setPipeline(nanPipeline);pass.setBindGroup(0,nanGroup);pass.draw(3);pass.end();
        encoder.copyBufferToBuffer(hits,0,hitRead,0,4);device.queue.submit([encoder.finish()]);
        await hitRead.mapAsync(GPUMapMode.READ);const count=new Uint32Array(hitRead.getMappedRange())[0];hitRead.unmap();
        if(mode===0?count===0:count!==0)throw Error('NaN cull: mode '+mode+' PS invocations '+count);
        nanCounts.push(count);tests++;
    }
    target.destroy();
    const nanError=await device.popErrorScope();if(nanError)throw Error(nanError.message);
    passed.push('NaN output: finite / one NaN vertex / all NaN vertices PS invocations = '+nanCounts.join(' / '));
    buffers.forEach(b=>b.destroy());
    output.textContent=`PASS ${tests} GPU cases\n${passed.join('\n')}\nExact IDs, count, empty/tail lanes, no duplicate/missing IDs, output guard, fixed arguments checked`;
  }catch(error){output.textContent='FAIL: '+error.message;}
  finally{device?.destroy();button.disabled=false;}
};
</script>
