<!doctype html>
<meta charset="utf-8"><title>大気遠近法 GPU検証</title>
<style>body{background:#152127;color:#e1e7e7;font:16px monospace;padding:24px}pre{white-space:pre-wrap}</style>
<h1>大気遠近法 GPU検証</h1><button id="run">実行</button><pre id="result">未実行</pre>
<script type="module">
const button=document.querySelector('#run'), output=document.querySelector('#result');
button.onclick=async()=>{
 let device;const resources=[];button.disabled=true;
 try{
  const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('GPUなし');
  device=await adapter.requestDevice();device.pushErrorScope('validation');
  const response=await fetch('/lab/webgpu/experiments/rendering-sandbox/v01/atmosphere.wgsl',{cache:'no-cache'});
  if(!response.ok)throw Error('シェーダー取得失敗');
  const code=await response.text()+`
@group(0) @binding(0) var<storage,read_write> values:array<vec4f>;
@compute @workgroup_size(1)
fn check(){
 let origin=vec3f(0.0,EARTH_RADIUS+2000.0,0.0);
 let sun=normalize(vec3f(0.5,0.5,0.5));
 let zero=integrateAtmosphere(origin,vec3f(1.0,0.0,0.0),sun,0.0);
 let near=integrateAtmosphere(origin,vec3f(1.0,0.0,0.0),sun,1000.0);
 let far=integrateAtmosphere(origin,vec3f(1.0,0.0,0.0),sun,10000.0);
 values[0]=vec4f(zero.transmittance,0.0);values[1]=vec4f(zero.scattering,0.0);
 values[2]=vec4f(near.transmittance,0.0);values[3]=vec4f(far.transmittance,0.0);
 values[4]=vec4f(near.scattering,0.0);values[5]=vec4f(far.scattering,0.0);
 values[6]=vec4f(solarTransmittance(origin,vec3f(0.0,-1.0,0.0)),0.0);
 values[7]=vec4f(integrateAtmosphere(origin,vec3f(0.0,1.0,0.0),sun,1e9).scattering,0.0);
}`;
  const module=device.createShaderModule({code});
  const errors=(await module.getCompilationInfo()).messages.filter(e=>e.type==='error');if(errors.length)throw Error(errors.map(e=>e.message).join('\n'));
  const buffer=usage=>{const b=device.createBuffer({size:128,usage});resources.push(b);return b;};
  const data=buffer(GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC),read=buffer(GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST);
  const pipeline=await device.createComputePipelineAsync({layout:'auto',compute:{module,entryPoint:'check'}});
  const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:data}}]});
  const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,group);pass.dispatchWorkgroups(1);pass.end();
  encoder.copyBufferToBuffer(data,0,read,0,128);device.queue.submit([encoder.finish()]);
  await read.mapAsync(GPUMapMode.READ);const v=new Float32Array(read.getMappedRange()).slice();read.unmap();
  if(!v.every(Number.isFinite))throw Error('非有限値が発生');
  for(let c=0;c<3;c++){
   if(v[c]!==1||v[4+c]!==0)throw Error('距離0の境界条件が不正');
   if(!(v[12+c]<v[8+c]&&v[8+c]<1&&v[12+c]>0))throw Error('透過率の距離依存が不正');
   if(!(v[20+c]>v[16+c]&&v[16+c]>0))throw Error('散乱光の距離依存が不正');
   if(v[24+c]!==0)throw Error('地球による太陽遮蔽が不正');
  }
  if(!(v[14]<v[12]&&v[30]>v[28]))throw Error('Rayleighの色依存が不正');
  const error=await device.popErrorScope();if(error)throw Error(error.message);
  output.textContent='PASS\n距離0: T=1 / S=0\n1km→10km: 透過率減少・散乱光増加\n青の減衰が赤より大きく、天頂は青優勢\n地球の裏へ向かう太陽光=0\n全値有限 / WebGPU validation errorなし';
 }catch(e){output.textContent='FAIL: '+e.message;}
 finally{resources.forEach(r=>r.destroy());device?.destroy();button.disabled=false;}
};
</script>
